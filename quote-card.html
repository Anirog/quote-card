<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Card</title>
  <meta name="description" content="A little perspective, one quote at a time.">
  <meta property="og:title" content="Quote Card">
  <meta property="og:description" content="A little perspective, one quote at a time.">
  <meta property="og:image" content="https://larrie-quote-card.larrieknights.chatgpt.site/og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Quote Card">
  <meta name="twitter:description" content="A little perspective, one quote at a time.">
  <meta name="twitter:image" content="https://larrie-quote-card.larrieknights.chatgpt.site/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
  <link rel="stylesheet" href="quote-card.css">
</head>
<body>
  <div class="card">
    <div class="card__border">
      <div class="card__content">
        <p class="card__text" id="quote"></p>
        <div class="card__meta">
          <span class="card__author" id="author"></span>
          <button class="card__refresh" id="copy-quote" type="button" aria-label="Copy quote">
            <i class="ph-light ph-copy"></i>
          </button>
          <button class="card__refresh" id="refresh-quote" type="button" aria-label="Show another quote">
            <i class="ph-light ph-arrow-clockwise"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  <p class="keyboard-hints" aria-label="Keyboard shortcuts: N for a new quote, C to copy the quote">
    <kbd>n</kbd> New quote
    <kbd class="keyboard-hints__copy-key">c</kbd> Copy quote
  </p>
  <script>
    let quotes = [];
    let currentIndex = -1;
    let copyResetTimeout;
    let isTransitioning = false;
    const fadeDuration = 180;

    function getNextQuoteIndex() {
      if (quotes.length <= 1) {
        return 0;
      }

      let nextIndex = Math.floor(Math.random() * quotes.length);
      while (nextIndex === currentIndex) {
        nextIndex = Math.floor(Math.random() * quotes.length);
      }

      return nextIndex;
    }

    function renderQuote(index) {
      const quoteElement = document.getElementById('quote');
      const authorElement = document.getElementById('author');
      quoteElement.textContent = quotes[index].text;
      authorElement.textContent = `– ${quotes[index].author}`;
      currentIndex = index;
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function showRandomQuote() {
      if (!quotes.length || isTransitioning) {
        return;
      }

      const nextIndex = getNextQuoteIndex();
      const quoteElement = document.getElementById('quote');
      const authorElement = document.getElementById('author');

      if (currentIndex === -1) {
        renderQuote(nextIndex);
        return;
      }

      isTransitioning = true;
      quoteElement.classList.add('card__text--hidden');
      authorElement.classList.add('card__author--hidden');

      await wait(fadeDuration);
      renderQuote(nextIndex);

      requestAnimationFrame(() => {
        quoteElement.classList.remove('card__text--hidden');
        authorElement.classList.remove('card__author--hidden');
      });

      await wait(fadeDuration);
      isTransitioning = false;
    }

    async function copyCurrentQuote() {
      if (currentIndex < 0 || !quotes[currentIndex]) {
        return;
      }

      const copyButton = document.getElementById('copy-quote');
      const originalContent = '<i class="ph-light ph-copy"></i>';
      const quote = quotes[currentIndex];
      const textToCopy = `${quote.text} — ${quote.author}`;

      try {
        await navigator.clipboard.writeText(textToCopy);

        copyButton.classList.add('card__refresh--copied');
        copyButton.innerHTML = '<i class="ph ph-check copy-success-icon"></i> Copied';
        copyButton.setAttribute('aria-label', 'Quote copied');

        clearTimeout(copyResetTimeout);
        copyResetTimeout = setTimeout(() => {
          copyButton.classList.remove('card__refresh--copied');
          copyButton.innerHTML = originalContent;
          copyButton.setAttribute('aria-label', 'Copy quote');
        }, 1500);
      } catch (error) {
        console.error('Error copying quote:', error);
      }
    }

    async function initQuotes() {
      try {
        const response = await fetch('/api/quotes');
        quotes = await response.json();
        showRandomQuote();
      } catch (error) {
        console.error('Error loading quote:', error);
        document.getElementById('quote').textContent = 'No matter how you feel today, get up, dress up and show up.';
        document.getElementById('author').textContent = '– Paulo Coelho';
      }
    }

    document.getElementById('copy-quote').addEventListener('click', copyCurrentQuote);
    document.getElementById('refresh-quote').addEventListener('click', showRandomQuote);
    document.addEventListener('keydown', (event) => {
      const isEditable = event.target.matches('input, textarea, select, [contenteditable]');

      if (isEditable || event.repeat || event.metaKey || event.ctrlKey || event.altKey) {
        return;
      }

      if (event.key.toLowerCase() === 'n') {
        showRandomQuote();
      } else if (event.key.toLowerCase() === 'c') {
        copyCurrentQuote();
      }
    });

    initQuotes();
  </script>
</body>
</html>
